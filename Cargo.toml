[package]
name = "cosmic-applet-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "COSMIC panel applet for network throughput and local MiJia power metrics"

[dependencies]
aes = "0.8"
hex = "0.4"
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["applet", "applet-token", "tokio", "wayland", "desktop", "winit"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "cosmic-applet-monitor"
path = "src/main.rs"

[lib]
name = "cosmic_applet_monitor"
path = "src/lib.rs"
