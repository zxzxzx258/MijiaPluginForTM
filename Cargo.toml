[package]
name = "mijia-network-power-dms"
version = "0.2.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DMS panel plugin helper for local MiJia power metrics"
autobins = false
autoexamples = false

[dependencies]
aes = "0.8"
hex = "0.4"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros"] }

[[bin]]
name = "mijia-power-helper"
path = "src/bin/mijia-power-helper.rs"

[lib]
name = "mijia_network_power_dms"
path = "src/lib.rs"
